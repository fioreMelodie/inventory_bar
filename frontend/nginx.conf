server {
    listen 80;
    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # API y panel de administración van al contenedor de Django.
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos del admin e imágenes de producto (volúmenes compartidos).
    location /static/ { alias /var/www/static/; }
    location /media/  { alias /var/www/media/; }

    # React Router: cualquier otra ruta devuelve la SPA.
    location / { try_files $uri $uri/ /index.html; }
}
